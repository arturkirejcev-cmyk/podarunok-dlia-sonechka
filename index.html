<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#130811">
<title>Маленький подарунок</title>
<style>
:root{--pink:#ff6fae;--rose:#ffb3d1;--bg:#100710}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff7fb;font-family:Georgia,"Times New Roman",serif;background:radial-gradient(ellipse at 50% 20%,#52203d 0,#210f20 42%,#09070d 100%);overflow-x:hidden}
main{width:min(100%,680px);margin:auto;min-height:100vh;padding:28px 18px 36px;display:flex;align-items:center;justify-content:center}
.screen{width:100%;text-align:center;position:relative;z-index:1}
.glow{font-size:clamp(52px,16vw,88px);filter:drop-shadow(0 0 22px #ff559e88);animation:float 3s ease-in-out infinite}
.heart-glow{width:clamp(86px,23vw,126px);height:clamp(86px,23vw,126px);margin:0 auto;position:relative;filter:drop-shadow(0 0 22px #ff559e88)}.heart-glow svg{width:100%;height:100%;overflow:visible}.heart-spark{position:absolute;color:#ffe4ef;text-shadow:0 0 12px #ff8dbd;font-family:Arial,sans-serif;animation:sparkle 2s ease-in-out infinite}.spark-a{right:-8px;top:10px;font-size:28px}.spark-b{left:-10px;bottom:15px;font-size:23px;animation-delay:.7s}
.button-heart{display:inline-flex;width:20px;height:20px;vertical-align:-4px;margin-right:5px}.button-heart svg{width:100%;height:100%;fill:#ffd6e7;filter:drop-shadow(0 0 4px #fff)}.inline-heart{display:inline-block;color:#ff6fae;text-shadow:0 0 10px #ff4b9d;animation:heartbeat 1.5s ease-in-out infinite}.tiny-heart{display:inline-block;color:#ff85b7;text-shadow:0 0 9px #ff4b9d;margin:0 5px;animation:heartbeat 1.8s ease-in-out infinite}
.bouquet{display:block;width:100%;height:auto;max-height:56vh;object-fit:contain;border-radius:20px;border:1px solid #ff9ac466;box-shadow:0 12px 42px #0008,0 0 25px #ff438544;margin:0 auto 10px;background:#160912}
h1{font-size:clamp(30px,8vw,47px);font-weight:normal;font-style:italic;line-height:1.2;margin:16px 0;color:#ffe0ee;text-shadow:0 0 18px #ff5c9d77}
.sub{font-family:Arial,sans-serif;color:#f4cddd;font-size:16px;line-height:1.6;margin:14px auto 28px;max-width:390px}
button{font-size:17px;font-weight:bold;color:#fff;border:1px solid #ff9ac4;border-radius:999px;padding:17px 25px;background:linear-gradient(135deg,#e72f7b,#a91f60);box-shadow:0 0 25px #ff4b9d66;cursor:pointer;min-height:56px;transition:transform .2s,box-shadow .2s}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid white;outline-offset:4px}
#gift{display:none;animation:appear 1s ease both}
#gift.show{display:block}
.bouquet{display:block;width:100%;height:auto;max-height:56vh;object-fit:contain;border-radius:20px;border:1px solid #ff9ac466;box-shadow:0 12px 42px #0008,0 0 25px #ff438544;margin:0 auto 10px;background:#160912}
.message{animation:textReveal 1.7s .25s both;font-size:clamp(27px,7vw,39px);font-style:italic;color:#ffd6e7;text-shadow:0 0 18px #ff4c9c88;line-height:1.35;margin:23px 0 10px}
.tiny{font-family:Arial,sans-serif;color:#eebbd0;font-size:14px;margin-top:12px}
.petal{position:fixed;top:-30px;z-index:0;pointer-events:none;animation:fall linear forwards;opacity:.9;width:22px;height:22px}.petal svg{width:100%;height:100%;fill:currentColor;filter:drop-shadow(0 0 5px currentColor)}
@keyframes sparkle{0%,100%{opacity:.45;transform:scale(.75) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(25deg)}}
@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes textReveal{from{opacity:0;transform:translateY(12px);letter-spacing:3px}to{opacity:1;transform:translateY(0);letter-spacing:normal}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes appear{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(620deg);opacity:.05}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>

<main>
<section class="screen" id="intro" aria-labelledby="title">
  <div class="glow heart-glow" aria-hidden="true"><svg viewBox="0 0 100 100" role="presentation"><defs><linearGradient id="heartFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd8e8"/><stop offset=".48" stop-color="#ff5b9f"/><stop offset="1" stop-color="#a71954"/></linearGradient><filter id="heartGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path d="M50 84 C42 76 12 55 12 32 C12 9 40 5 50 26 C61 5 88 9 88 32 C88 55 59 77 50 84Z" fill="url(#heartFill)" stroke="#ffd8e8" stroke-width="2" filter="url(#heartGlow)"/><path d="M25 29 C27 18 37 17 42 22" fill="none" stroke="#fff5fa" stroke-width="4" stroke-linecap="round" opacity=".9"/></svg><span class="heart-spark spark-a">✦</span><span class="heart-spark spark-b">✧</span></div>
  <h1 id="title">Для мого сонечка<br>є дещо особливе…</h1>
  <p class="sub">Я хочу подарувати тобі трішки тепла, ніжності й усмішки. Відкрий свій маленький сюрприз <span class="inline-heart" aria-hidden="true">♥</span></p>
  <button id="open" type="button">Відкрити подарунок <span class="button-heart" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21S2.5 15.1 2.5 8.5C2.5 3.3 9 2 12 7c3-5 9.5-3.7 9.5 1.5C21.5 15.1 12 21 12 21Z"/></svg></span></button>
</section>
